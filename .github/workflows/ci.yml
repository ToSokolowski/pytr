name: Checks

# This fork does not publish to PyPI (the `pytr` name belongs to upstream), so there is
# no publish job and no job ever holds a publishing token. Install from this repo instead:
#   pip install git+https://github.com/ToSokolowski/pytr@<commit-sha>
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Must be able to read the lock file format of uv.lock.
  UV_VERSION: 0.11.21

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      # --locked everywhere: fail if uv.lock and pyproject.toml disagree instead of
      # re-resolving, and use the hash-pinned versions from uv.lock (ruff included).
      - name: Pytest
        run: uv run --locked pytest
      - name: Ruff check
        run: uv run --locked ruff check
      - name: Ruff format
        run: uv run --locked ruff format --check --diff
      - name: Mypy type check
        run: uv run --locked mypy .
      - name: Check if README.md automatically generated content is up to date
        run: diff -u <(printf '%s\n' "$(cat README.md)") <(printf '%s\n' "$(uvx mksync@0.1.5 README.md)")
      - name: Build wheel
        if: matrix.python-version == '3.13'
        run: uv build
