name: Build and publish Python distributions to PyPI

on:
  push:
    branches: ["master"]
    tags: ["*"]
  pull_request:
    branches: ["*"]

# Least privilege for every job; the publish job asks for the OIDC token it needs.
permissions:
  contents: read

env:
  # Must be able to read the lock file format of uv.lock.
  UV_VERSION: 0.11.21

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      - name: Pytest
        # --locked fails the build if uv.lock and pyproject.toml disagree instead of re-resolving.
        run: uv run --locked pytest
      - name: Ruff check
        run: uvx ruff@0.9.6 check
      - name: Ruff format
        run: uvx ruff@0.9.6 format --check --diff
      - name: Mypy type check
        run: uv run --locked mypy .
      - name: Check if README.md automatically generated content is up to date
        run: diff -u <(printf '%s\n' "$(cat README.md)") <(printf '%s\n' "$(uvx mksync@0.1.5 README.md)")

  build-n-publish:
    name: Build and publish Python distributions to PyPI
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      # PyPI Trusted Publishing: a short-lived token per run instead of a stored API token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Build wheel
        run: uv build
      - name: Publish distribution to PyPI
        if: startsWith(github.event.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
