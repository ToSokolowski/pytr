[build-system]
requires = ["hatchling", "hatch-babel"]
build-backend = "hatchling.build"

[project]
name = "pytr"
version = "0.4.11"
description = "Use TradeRepublic in terminal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "marzzzello", email = "853485-marzzzello@users.noreply.gitlab.com" }
]
urls = { "Homepage" = "https://github.com/pytr-org/pytr" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Investment",
]
# Kept deliberately short: every dependency is code that runs next to the PIN and the
# session cookies. Exact versions and hashes are pinned in uv.lock.
dependencies = [
    "babel",
    "certifi",
    "cryptography",
    "keyring>=25",
    "pathvalidate",
    "requests",
    "websockets>=14",
]

[project.optional-dependencies]
# Only `--waf-token playwright` (the CLI default) needs this, and it drags in a
# ~130 MB package plus a ~630 MB Chromium download that `playwright install`
# fetches separately. The pure-Python `--waf-token awswaf` path solves the same
# challenge without either, so deployments that use it — or that find their IP
# is not challenged at all — should not have to carry the browser.
playwright = [
    "playwright>=1.62.0",
]
completion = [
    "shtab",
]
# Only `--waf-token awswaf` needs this. It ships a precompiled binary
# (curl-impersonate), the one dependency whose code can't be read as source.
awswaf = [
    "curl_cffi",
]

[project.scripts]
pytr = "pytr.main:main"

[tool.hatch.build.hooks.babel]
locale_dir = "pytr/locale"

[dependency-groups]
dev = [
    "ruff==0.9.6",
    "pytest>=8.3.4",
    "mypy>=1.15.0",
    "types-babel>=2.11.0.15",
    "types-requests>=2.32.0.20241016",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
python_version = "3.10"

# Optional extra, not installed in the default dev environment.
[[tool.mypy.overrides]]
module = ["curl_cffi", "curl_cffi.*"]
ignore_missing_imports = true
